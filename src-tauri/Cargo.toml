[package]
name = "gmeer"
version = "1.0.3"
description = "Google Calendar reminders in the Windows system tray (Rust + Tauri v2)"
authors = ["Mikkie"]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/mikkie71/GMeer"

[[bin]]
name = "GMeer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
tauri-plugin-single-instance = "2"
